<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Tactical FPS - Vibrant Mobile Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            touch-action: none;
            background-color: #2b1d14;
        }

        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Top HUD Elements */
        #topHud {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
            z-index: 5;
        }

        .hud-panel {
            background: rgba(10, 20, 30, 0.6);
            padding: 8px 15px;
            border-radius: 4px;
            color: #fff;
            font-weight: bold;
            font-size: 14px;
            text-shadow: 1px 1px 2px #000;
            border-left: 4px solid #00ffcc;
        }

        .health-container {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .bar-bg {
            width: 150px;
            height: 12px;
            background: rgba(0,0,0,0.8);
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #444;
        }

        #playerHealthBar {
            width: 100%;
            height: 100%;
            /* Vibrant gradient health bar */
            background: linear-gradient(90deg, #ff0055, #ffdd00, #00ffcc);
            transition: width 0.2s ease;
        }

        /* Center Target Reticle */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 30px;
            height: 30px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 5;
            background-image: radial-gradient(circle, #00ffcc 10%, transparent 15%);
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: #fff;
            box-shadow: 0 0 4px #00ffcc;
        }
        #crosshair::before { top: 14px; left: -10px; width: 50px; height: 2px; }
        #crosshair::after { top: -10px; left: 14px; width: 2px; height: 50px; }

        /* Multi-touch Area */
        #touchPad {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 3;
        }

        /* Movement Joystick (Left) */
        #joystickContainer {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 120px;
            height: 120px;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: none;
            transform: translate(-50%, -50%);
            z-index: 4;
        }
        #joystickKnob {
            position: absolute;
            top: 35px;
            left: 35px;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        /* Action Buttons (Right) - Styled like the image */
        .action-btn {
            position: absolute;
            background: rgba(20, 30, 40, 0.7);
            border: 3px solid #ffcc00;
            color: #ffcc00;
            font-weight: bold;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 6;
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.3);
            text-shadow: 1px 1px 2px #000;
        }
        .action-btn:active {
            background: #ffcc00;
            color: #111;
        }
        #fireBtn {
            bottom: 40px;
            right: 40px;
            width: 90px;
            height: 90px;
            font-size: 20px;
        }
        #reloadBtn {
            bottom: 150px;
            right: 50px;
            width: 60px;
            height: 60px;
            font-size: 12px;
            border-color: #00ffcc;
            color: #00ffcc;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
        }

        /* Menu Overlay */
        #menuOverlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #1a1025, #3a2015);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 10;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .btn {
            background: #ffcc00;
            color: #111;
            border: none;
            padding: 15px 45px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 8px;
            margin-top: 20px;
            box-shadow: 0 5px 15px rgba(255, 204, 0, 0.4);
        }

        /* Bot Labels */
        .bot-health-label {
            position: absolute;
            color: #fff;
            font-weight: bold;
            background: rgba(0,0,0,0.7);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            pointer-events: none;
            transform: translate(-50%, -100%);
            border: 1px solid #00ffcc;
            display: none;
            z-index: 2;
        }
    </style>
</head>
<body>

    <div id="menuOverlay">
        <h1 style="font-size: 34px; color: #ffcc00; margin: 0 0 5px 0;">VIBRANT ARENA</h1>
        <p style="color: #ddd; font-size: 15px; margin: 0 0 15px 0; max-width: 300px; line-height: 1.6;">
            Left Screen: Move<br>
            Right Screen: Aim<br>
            Use Circular Buttons to Fire/Reload
        </p>
        <button class="btn" id="deployBtn">DEPLOY</button>
    </div>

    <div id="crosshair"></div>

    <div id="topHud">
        <div class="hud-panel health-container">
            <div>OPERATOR HP</div>
            <div class="bar-bg"><div id="playerHealthBar"></div></div>
        </div>
        <div class="hud-panel" id="ammoDisplay">
            AMMO: 30 / 30
        </div>
    </div>

    <div id="fireBtn" class="action-btn">FIRE</div>
    <div id="reloadBtn" class="action-btn">RELOAD</div>

    <div id="touchPad"></div>
    <div id="joystickContainer">
        <div id="joystickKnob"></div>
    </div>

    <div id="botUIContainer"></div>
    <canvas id="gameCanvas"></canvas>

    <script>
        let scene, camera, renderer, clock = new THREE.Clock();
        let gameActive = false;
        
        let player = { health: 100, maxHealth: 100, ammo: 30, maxAmmo: 30, isReloading: false, speed: 9, position: new THREE.Vector3(0, 1.6, 20) };
        let pitch = 0, yaw = 0;
        let gunMesh;
        let isShootingAnim = false, shootAnimTimer = 0;
        let bots = [];
        const botCount = 3;

        let joystickTouchId = null, lookTouchId = null;
        let joystickCenter = new THREE.Vector2(), joystickMove = new THREE.Vector2(), lastLookPos = new THREE.Vector2();

        function init() {
            // 1. Vibrant Scene Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xff8855); // Sunset orange sky
            scene.fog = new THREE.FogExp2(0xff8855, 0.02);

            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.copy(player.position);

            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gameCanvas'), antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
            renderer.shadowMap.enabled = true;

            // 2. Warmer, Brighter Lighting
            const hemiLight = new THREE.HemisphereLight(0x66aaff, 0xffaa55, 0.6); // Blue sky, orange ground bounce
            scene.add(hemiLight);

            const dirLight = new THREE.DirectionalLight(0xffeedd, 1.2); // Bright sun
            dirLight.position.set(20, 50, -20);
            dirLight.castShadow = true;
            scene.add(dirLight);

            createArena();
            createPistol();
            spawnBots();
            setupMobileTouch();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            const deployBtn = document.getElementById('deployBtn');
            const launchGame = (e) => {
                e.preventDefault();
                document.getElementById('menuOverlay').style.display = 'none';
                gameActive = true;
            };
            deployBtn.addEventListener('touchstart', launchGame, {passive: false});
            deployBtn.addEventListener('click', launchGame);
        }

        function createArena() {
            // Sandy textured floor
            const floorGeo = new THREE.PlaneGeometry(80, 80);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0xeebb77, roughness: 1.0 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Map Structures Materials
            const stoneMat = new THREE.MeshStandardMaterial({ color: 0xaa9988, roughness: 0.8 });
            const woodMat = new THREE.MeshStandardMaterial({ color: 0x553311, roughness: 0.9 });
            const crateMat = new THREE.MeshStandardMaterial({ color: 0x557755, roughness: 0.7 });

            // Boundary Walls
            const walls = [
                { w: 80, h: 8, d: 2, x: 0, z: -40 },
                { w: 80, h: 8, d: 2, x: 0, z: 40 },
                { w: 2, h: 8, d: 80, x: -40, z: 0 },
                { w: 2, h: 8, d: 80, x: 40, z: 0 }
            ];
            walls.forEach(b => {
                const mesh = new THREE.Mesh(new THREE.BoxGeometry(b.w, b.h, b.d), stoneMat);
                mesh.position.set(b.x, b.h/2, b.z);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                scene.add(mesh);
            });

            // Central Watchtower
            const towerLegGeo = new THREE.CylinderGeometry(0.2, 0.2, 8);
            const legPositions = [[-3, -3], [3, -3], [-3, 3], [3, 3]];
            legPositions.forEach(pos => {
                const leg = new THREE.Mesh(towerLegGeo, woodMat);
                leg.position.set(pos[0], 4, pos[1]);
                leg.castShadow = true;
                scene.add(leg);
            });
            const towerPlatform = new THREE.Mesh(new THREE.BoxGeometry(7, 0.5, 7), woodMat);
            towerPlatform.position.set(0, 8, 0);
            towerPlatform.castShadow = true;
            scene.add(towerPlatform);

            // Scattered Crates
            const crates = [
                { x: -15, z: -10 }, { x: -15, z: -12, y: 2 }, { x: -13, z: -10 },
                { x: 20, z: 15 }, { x: 22, z: 15 }
            ];
            crates.forEach(c => {
                const mesh = new THREE.Mesh(new THREE.BoxGeometry(3, 3, 3), crateMat);
                mesh.position.set(c.x, c.y ? c.y + 1.5 : 1.5, c.z);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                scene.add(mesh);
            });
        }

        function createPistol() {
            gunMesh = new THREE.Group();
            
            // Pistol Slide/Barrel (Top part)
            const slideMat = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.8, roughness: 0.2 });
            const slide = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.04, 0.2), slideMat);
            slide.position.set(0, 0.05, -0.1);
            gunMesh.add(slide);

            // Pistol Grip (Angled bottom part)
            const gripMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });
            const grip = new THREE.Mesh(new THREE.BoxGeometry(0.035, 0.1, 0.05), gripMat);
            grip.position.set(0, -0.02, 0);
            grip.rotation.x = Math.PI / 8; // Tilt grip backward
            gunMesh.add(grip);

            // Iron Sights (Tiny glowing dots)
            const sightMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc });
            const sight = new THREE.Mesh(new THREE.BoxGeometry(0.005, 0.005, 0.005), sightMat);
            sight.position.set(0, 0.075, -0.18);
            gunMesh.add(sight);

            scene.add(gunMesh);
        }

        function spawnBots() {
            const container = document.getElementById('botUIContainer');
            for(let i=0; i < botCount; i++) {
                const botGroup = new THREE.Group();
                
                // Bot Body
                const body = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 1.8, 8), new THREE.MeshStandardMaterial({ color: 0xff3344 }));
                body.position.y = 0.9;
                botGroup.add(body);

                // Bot Head
                const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), new THREE.MeshStandardMaterial({ color: 0x222222 }));
                head.position.set(0, 2.05, 0);
                botGroup.add(head);

                botGroup.position.set((Math.random() - 0.5) * 50, 0, (Math.random() - 0.5) * 50);
                scene.add(botGroup);

                const label = document.createElement('div');
                label.className = 'bot-health-label';
                label.innerText = 'BOT HP: 100';
                container.appendChild(label);

                bots.push({ mesh: botGroup, health: 100, domElement: label, speed: 3.5 + Math.random() * 2, directionTimer: 0, moveVector: new THREE.Vector3(), lastShotTime: 0 });
            }
        }

        function setupMobileTouch() {
            const pad = document.getElementById('touchPad');
            const joyContainer = document.getElementById('joystickContainer');
            const joyKnob = document.getElementById('joystickKnob');

            pad.addEventListener('touchstart', (e) => {
                if (!gameActive) return;
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    if (touch.clientX < window.innerWidth / 2 && joystickTouchId === null) {
                        joystickTouchId = touch.identifier;
                        joystickCenter.set(touch.clientX, touch.clientY);
                        joyContainer.style.display = 'block';
                        joyContainer.style.left = `${touch.clientX}px`;
                        joyContainer.style.top = `${touch.clientY}px`;
                        joyKnob.style.transform = `translate(0px, 0px)`;
                    } else if (touch.clientX >= window.innerWidth / 2 && lookTouchId === null) {
                        lookTouchId = touch.identifier;
                        lastLookPos.set(touch.clientX, touch.clientY);
                    }
                }
            }, {passive: true});

            pad.addEventListener('touchmove', (e) => {
                if (!gameActive) return;
                for (let i = 0; i < e.touches.length; i++) {
                    const touch = e.touches[i];
                    if (touch.identifier === joystickTouchId) {
                        let distX = touch.clientX - joystickCenter.x, distY = touch.clientY - joystickCenter.y;
                        const maxDist = 45;
                        const angle = Math.atan2(distY, distX), distance = Math.min(maxDist, Math.hypot(distX, distY));
                        const knobX = Math.cos(angle) * distance, knobY = Math.sin(angle) * distance;
                        joyKnob.style.transform = `translate(${knobX}px, ${knobY}px)`;
                        joystickMove.set(knobX / maxDist, knobY / maxDist);
                    } else if (touch.identifier === lookTouchId) {
                        yaw -= (touch.clientX - lastLookPos.x) * 0.005;
                        pitch -= (touch.clientY - lastLookPos.y) * 0.005;
                        pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));
                        camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
                        lastLookPos.set(touch.clientX, touch.clientY);
                    }
                }
            }, {passive: true});

            const endTouch = (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    if (touch.identifier === joystickTouchId) {
                        joystickTouchId = null; joystickMove.set(0, 0); joyContainer.style.display = 'none';
                    } else if (touch.identifier === lookTouchId) {
                        lookTouchId = null;
                    }
                }
            };
            pad.addEventListener('touchend', endTouch);
            pad.addEventListener('touchcancel', endTouch);

            document.getElementById('fireBtn').addEventListener('touchstart', (e) => { e.preventDefault(); fireWeapon(); });
            document.getElementById('reloadBtn').addEventListener('touchstart', (e) => { e.preventDefault(); reloadWeapon(); });
        }

        function fireWeapon() {
            if (player.isReloading || !gameActive) return;
            if (player.ammo > 0) {
                player.ammo--;
                updateHUD();
                isShootingAnim = true; shootAnimTimer = 0;

                const raycaster = new THREE.Raycaster();
                raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
                const targets = bots.map(b => b.mesh.children[0]); // Target bodies
                const intersects = raycaster.intersectObjects(targets);

                if (intersects.length > 0) {
                    const idx = bots.findIndex(b => b.mesh.children[0] === intersects[0].object);
                    if (idx !== -1) damageBot(idx, 34);
                }
            } else { reloadWeapon(); }
        }

        function reloadWeapon() {
            if (player.isReloading || player.ammo === player.maxAmmo) return;
            player.isReloading = true;
            document.getElementById('ammoDisplay').innerText = "RELOADING...";
            setTimeout(() => { player.ammo = player.maxAmmo; player.isReloading = false; updateHUD(); }, 1200);
        }

        function damageBot(idx, amount) {
            const bot = bots[idx];
            bot.health -= amount;
            if (bot.health <= 0) {
                bot.mesh.position.set((Math.random() - 0.5) * 50, 0, (Math.random() - 0.5) * 50);
                bot.health = 100;
            }
            bot.domElement.innerText = `BOT HP: ${Math.floor(bot.health)}`;
        }

        function damagePlayer(amount) {
            player.health -= amount;
            if (player.health <= 0) {
                player.health = 100;
                camera.position.set(0, 1.6, 20);
                yaw = 0; pitch = 0;
                camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
                gameActive = false;
                document.getElementById('menuOverlay').style.display = 'flex';
            }
            updateHUD();
        }

        function updateHUD() {
            document.getElementById('playerHealthBar').style.width = `${player.health}%`;
            document.getElementById('ammoDisplay').innerText = `AMMO: ${player.ammo} / ${player.maxAmmo}`;
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1);

            if (gameActive) {
                // Movement
                if (joystickMove.lengthSq() > 0) {
                    const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                    const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
                    forward.y = 0; right.y = 0; forward.normalize(); right.normalize();
                    camera.position.addScaledVector(forward, -joystickMove.y * player.speed * delta);
                    camera.position.addScaledVector(right, joystickMove.x * player.speed * delta);
                }
                camera.position.x = Math.max(-38, Math.min(38, camera.position.x));
                camera.position.z = Math.max(-38, Math.min(38, camera.position.z));

                // Weapon Positioning (Pistol holding style)
                gunMesh.position.copy(camera.position);
                gunMesh.quaternion.copy(camera.quaternion);
                gunMesh.translateZ(-0.25);
                gunMesh.translateX(0.08);
                gunMesh.translateY(-0.15);

                if (isShootingAnim) {
                    shootAnimTimer += delta * 45;
                    if (shootAnimTimer < Math.PI) {
                        // Pistol recoil (snappier rotation upwards)
                        gunMesh.translateZ(Math.sin(shootAnimTimer) * 0.02);
                        gunMesh.rotateX(Math.sin(shootAnimTimer) * 0.1);
                    } else { isShootingAnim = false; }
                }

                // AI Bots
                const timeNow = performance.now();
                bots.forEach((bot) => {
                    bot.directionTimer -= delta;
                    if (bot.directionTimer <= 0) {
                        bot.directionTimer = 1.5 + Math.random() * 2;
                        bot.moveVector.set((Math.random() - 0.5), 0, (Math.random() - 0.5)).normalize();
                    }
                    bot.mesh.position.addScaledVector(bot.moveVector, bot.speed * delta);
                    
                    if (bot.mesh.position.distanceTo(camera.position) < 18) {
                        bot.mesh.lookAt(camera.position.x, bot.mesh.position.y, camera.position.z);
                        if (timeNow - bot.lastShotTime > 1500) {
                            bot.lastShotTime = timeNow;
                            if (Math.random() > 0.5) damagePlayer(12);
                        }
                    } else if (bot.moveVector.lengthSq() > 0) {
                        bot.mesh.rotation.y = Math.atan2(bot.moveVector.x, bot.moveVector.z);
                    }

                    // Floating UI
                    const pos = new THREE.Vector3();
                    bot.mesh.getWorldPosition(pos);
                    pos.y += 2.5;
                    pos.project(camera);
                    if (pos.z <= 1 && Math.abs(pos.x) < 1 && Math.abs(pos.y) < 1) {
                        bot.domElement.style.left = `${(pos.x * .5 + .5) * window.innerWidth}px`;
                        bot.domElement.style.top = `${(pos.y * -.5 + .5) * window.innerHeight}px`;
                        bot.domElement.style.display = 'block';
                    } else {
                        bot.domElement.style.display = 'none';
                    }
                });
            } else {
                bots.forEach(b => b.domElement.style.display = 'none');
            }
            renderer.render(scene, camera);
        }

        init();
        animate();
    </script>
</body>
</html>
