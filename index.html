<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Tactical FPS (Single Player with Bots)</title>
    <!-- Include Three.js via CDN for 3D Graphics -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Heads Up Display (HUD) */
        #hud {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }

        .hud-panel {
            background: rgba(0, 0, 0, 0.65);
            padding: 15px 25px;
            border-radius: 8px;
            border: 2px solid #00ffcc;
            color: #fff;
            font-weight: bold;
            font-size: 20px;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
        }

        .health-container {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .bar-bg {
            width: 200px;
            height: 15px;
            background: #441111;
            border-radius: 4px;
            overflow: hidden;
        }

        #playerHealthBar {
            width: 100%;
            height: 100%;
            background: #ff3333;
            transition: width 0.1s ease;
        }

        /* Crosshair */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: #00ffcc;
        }
        #crosshair::before { top: 4px; left: -10px; width: 30px; height: 2px; }
        #crosshair::after { top: -10px; left: 4px; width: 2px; height: 30px; }

        /* Menu Screens */
        #menuOverlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 15, 20, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 10;
            text-align: center;
        }

        .btn {
            background: #00ffcc;
            color: #050b10;
            border: none;
            padding: 15px 40px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 20px;
            transition: transform 0.2s, background 0.2s;
        }
        .btn:hover {
            background: #ffffff;
            transform: scale(1.05);
        }

        /* World Floating Healthbars for Bots */
        .bot-health-label {
            position: absolute;
            color: #ff3333;
            font-weight: bold;
            background: rgba(0,0,0,0.7);
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 12px;
            pointer-events: none;
            transform: translate(-50%, -100%);
            border: 1px solid #ff3333;
            display: none;
        }
    </style>
</head>
<body>

    <div id="menuOverlay">
        <h1 style="font-size: 48px; color: #00ffcc; margin-bottom: 5px;">TACTICAL BOT ARENA</h1>
        <p style="color: #aaa;">WASD to move | Mouse to Aim & Shoot | R to Reload</p>
        <button class="btn" onclick="startGame()">DEPLOY TO ARENA</button>
    </div>

    <div id="crosshair"></div>

    <div id="hud">
        <div class="hud-panel health-container">
            <div>OPERATOR HP</div>
            <div class="bar-bg"><div id="playerHealthBar"></div></div>
        </div>
        <div class="hud-panel" id="ammoDisplay">
            MAG: 30 / 30
        </div>
    </div>

    <!-- Container for dynamic bot health overlays -->
    <div id="botUIContainer"></div>

    <canvas id="gameCanvas"></canvas>

    <script>
        // --- Core Setup Variables ---
        let scene, camera, renderer;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let clock = new THREE.Clock();
        
        // Player Mechanics
        let player = {
            health: 100,
            maxHealth: 100,
            ammo: 30,
            maxAmmo: 30,
            isReloading: false,
            speed: 12,
            position: new THREE.Vector3(0, 1.6, 20) // Eyes at 1.6m height
        };

        // Input Look Processing
        let pitch = 0, yaw = 0;
        const mouseSensitivity = 0.002;

        // Weapon Rig Variables
        let gunMesh;
        let isShootingAnim = false, shootAnimTimer = 0;

        // Entities (Bots)
        let bots = [];
        const botCount = 4;

        function init() {
            // 1. Create Scene & Base View
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0f18);
            scene.fog = new THREE.FogExp2(0x0a0f18, 0.015);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.copy(player.position);

            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gameCanvas'), antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;

            // 2. Lighting Setup
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
            scene.add(ambientLight);

            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.4);
            hemiLight.position.set(0, 200, 0);
            scene.add(hemiLight);

            // Tactical Neon Direct Light
            const dirLight = new THREE.DirectionalLight(0x00ffcc, 0.8);
            dirLight.position.set(20, 40, 20);
            scene.add(dirLight);

            // 3. Environment/Map Generation (3D Cyber Arena)
            createArena();

            // 4. Weapon Mesh Implementation (The First-Person Gun View)
            createGun();

            // 5. Build Enemy Bots
            spawnBots();

            // 6. Hook Listeners
            window.addEventListener('resize', onWindowResize);
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mousedown', onMouseDown);
            document.addEventListener('pointerlockchange', lockChange);
        }

        // --- Tactical Environment Structure ---
        function createArena() {
            // Textured Floor Grid
            const floorGeo = new THREE.PlaneGeometry(80, 80);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x111622, roughness: 0.8 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            const grid = new THREE.GridHelper(80, 40, 0x00ffcc, 0x223344);
            grid.position.y = 0.01;
            scene.add(grid);

            // Obstacles & Tactical Walls
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x1b2436, roughness: 0.4, metalness: 0.1 });
            const neonMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc });

            const structuralBlocks = [
                { w: 30, h: 6, d: 2, x: 0, z: -15 }, // Center block wall
                { w: 2, h: 6, d: 20, x: -15, z: 5 }, // Left wing cover
                { w: 2, h: 6, d: 20, x: 15, z: 5 },  // Right wing cover
                { w: 6, h: 4, d: 6, x: 0, z: 10 },    // Center block box
            ];

            structuralBlocks.forEach(b => {
                const geo = new THREE.BoxGeometry(b.w, b.h, b.d);
                const mesh = new THREE.Mesh(geo, wallMat);
                mesh.position.set(b.x, b.h / 2, b.z);
                scene.add(mesh);

                // Decorative Neon Trim Layer lines
                const edgeGeo = new THREE.BoxGeometry(b.w + 0.1, 0.1, b.d + 0.1);
                const edgeMesh = new THREE.Mesh(edgeGeo, neonMat);
                edgeMesh.position.set(b.x, b.h, b.z);
                scene.add(edgeMesh);
            });
        }

        // --- View Model Weapon Layout ---
        function createGun() {
            gunMesh = new THREE.Group();

            // Main Gun Receiver
            const bodyGeo = new THREE.BoxGeometry(0.05, 0.06, 0.3);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.8, roughness: 0.2 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            gunMesh.add(body);

            // Gun Barrel
            const barrelGeo = new THREE.CylinderGeometry(0.015, 0.015, 0.2);
            barrelGeo.rotateX(Math.PI / 2);
            const barrel = new THREE.Mesh(barrelGeo, bodyMat);
            barrel.position.set(0, 0.01, -0.2);
            gunMesh.add(barrel);

            // Holographic Laser Sight Glow
            const laserGeo = new THREE.BoxGeometry(0.005, 0.005, 0.04);
            const laserMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc });
            const sight = new THREE.Mesh(laserGeo, laserMat);
            sight.position.set(0, 0.04, -0.05);
            gunMesh.add(sight);

            scene.add(gunMesh);
        }

        // --- Bot Logic & Deployment ---
        function spawnBots() {
            const botContainerUI = document.getElementById('botUIContainer');
            
            for(let i=0; i < botCount; i++) {
                // 3D Visual Model
                const botGroup = new THREE.Group();
                
                // Torso Chassis
                const bodyGeo = new THREE.CylinderGeometry(0.4, 0.4, 1.8, 8);
                const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff3333, metalness: 0.5 });
                const body = new THREE.Mesh(bodyGeo, bodyMat);
                body.position.y = 0.9;
                botGroup.add(body);

                // Visor Target Lens
                const visorGeo = new THREE.BoxGeometry(0.5, 0.15, 0.2);
                const visorMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
                const visor = new THREE.Mesh(visorGeo, visorMat);
                visor.position.set(0, 1.5, -0.35);
                botGroup.add(visor);

                // Dynamic Random Position Spawns
                botGroup.position.set(
                    (Math.random() - 0.5) * 50,
                    0,
                    (Math.random() - 0.5) * 40 - 10
                );

                scene.add(botGroup);

                // Creating runtime HTML overlay label elements for health displays
                const label = document.createElement('div');
                label.className = 'bot-health-label';
                label.id = `bot-ui-${i}`;
                label.innerText = 'BOT HP: 100';
                botContainerUI.appendChild(label);

                bots.push({
                    mesh: botGroup,
                    health: 100,
                    domElement: label,
                    speed: 4 + Math.random() * 3,
                    directionTimer: 0,
                    moveVector: new THREE.Vector3(),
                    lastShotTime: 0
                });
            }
        }

        // --- Interaction Controls & Locks ---
        function startGame() {
            document.body.requestPointerLock();
        }

        function lockChange() {
            const overlay = document.getElementById('menuOverlay');
            if (document.pointerLockElement === document.body) {
                overlay.style.display = 'none';
            } else {
                overlay.style.display = 'flex';
            }
        }

        function onKeyDown(e) {
            switch (e.code) {
                case 'KeyW': moveForward = true; break;
                case 'KeyS': moveBackward = true; break;
                case 'KeyA': moveLeft = true; break;
                case 'KeyD': moveRight = true; break;
                case 'KeyR': reloadWeapon(); break;
            }
        }

        function onKeyUp(e) {
            switch (e.code) {
                case 'KeyW': moveForward = false; break;
                case 'KeyS': moveBackward = false; break;
                case 'KeyA': moveLeft = false; break;
                case 'KeyD': moveRight = false; break;
            }
        }

        function onMouseMove(e) {
            if (document.pointerLockElement !== document.body) return;

            yaw -= e.movementX * mouseSensitivity;
            pitch -= e.movementY * mouseSensitivity;

            // Stop camera from doing vertical flips
            pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));

            camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
        }

        // --- Fire Control Loop ---
        function onMouseDown(e) {
            if (document.pointerLockElement !== document.body || player.isReloading) return;

            if (player.ammo > 0) {
                player.ammo--;
                updateHUD();
                
                // Fire procedural recoil framework animation state
                isShootingAnim = true;
                shootAnimTimer = 0;

                // Fire processing core Raycast targeting
                const raycaster = new THREE.Raycaster();
                // Send center calculation ray trace outward
                raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
                
                // Track objects impacted
                const targets = bots.map(b => b.mesh.children[0]); // Target cylinders inside groups
                const intersects = raycaster.intersectObjects(targets);

                if (intersects.length > 0) {
                    const hitObject = intersects[0].object;
                    // Find actual parent structural controller index mapping
                    const index = bots.findIndex(b => b.mesh.children[0] === hitObject);
                    if (index !== -1) {
                        damageBot(index, 25);
                    }
                }
            } else {
                // Automatic handling execution if dry clicked
                reloadWeapon();
            }
        }

        function reloadWeapon() {
            if (player.isReloading || player.ammo === player.maxAmmo) return;
            player.isReloading = true;
            document.getElementById('ammoDisplay').innerText = "RELOADING...";
            
            setTimeout(() => {
                player.ammo = player.maxAmmo;
                player.isReloading = false;
                updateHUD();
            }, 1800); // 1.8 second tact cycle reload window
        }

        function damageBot(index, amount) {
            const bot = bots[index];
            bot.health -= amount;
            if (bot.health <= 0) {
                bot.health = 0;
                bot.mesh.position.set((Math.random() - 0.5) * 50, 0, (Math.random() - 0.5) * 40 - 10);
                bot.health = 100; // Reset state pattern spawn
            }
            bot.domElement.innerText = `BOT HP: ${bot.health}`;
        }

        function damagePlayer(amount) {
            player.health -= amount;
            if (player.health <= 0) {
                player.health = 0;
                alert("Eliminated! Returning to safe checkpoint grid.");
                player.health = 100;
                camera.position.set(0, 1.6, 20);
                yaw = 0; pitch = 0;
            }
            updateHUD();
        }

        function updateHUD() {
            document.getElementById('playerHealthBar').style.width = `${player.health}%`;
            document.getElementById('ammoDisplay').innerText = `MAG: ${player.ammo} / ${player.maxAmmo}`;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- Core Engine Runtime Operations Frame Tick ---
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (document.pointerLockElement === document.body) {
                // 1. Process Translation Local Coordinates Tracking
                const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
                forward.y = 0; right.y = 0; // Flatten axis execution path mappings
                forward.normalize(); right.normalize();

                let moveDirection = new THREE.Vector3();
                if (moveForward) moveDirection.add(forward);
                if (moveBackward) moveDirection.add(moveBackward.copy ? moveBackward : forward.clone().negate());
                if (moveLeft) moveDirection.add(right.clone().negate());
                if (moveRight) moveDirection.add(right);
                
                moveDirection.normalize();
                camera.position.addScaledVector(moveDirection, player.speed * delta);

                // 2. Weapon Transformation Frame Interpolation (Procedural Motion Track)
                gunMesh.position.copy(camera.position);
                gunMesh.quaternion.copy(camera.quaternion);
                
                // Gun Positioning Offset (Position frame variables on viewport right screen)
                gunMesh.translateZ(-0.35);
                gunMesh.translateX(0.12);
                gunMesh.translateY(-0.14);

                // Weapon Fire Animation Processing Lifecycle loop
                if (isShootingAnim) {
                    shootAnimTimer += delta * 35;
                    if (shootAnimTimer < Math.PI) {
                        // Kick recoil model backwards
                        gunMesh.translateZ(Math.sin(shootAnimTimer) * 0.05);
                        gunMesh.rotateX(Math.sin(shootAnimTimer) * 0.1);
                    } else {
                        isShootingAnim = false;
                    }
                }

                // 3. AI Bot Behavioral Updates 
                const now = performance.now();
                bots.forEach((bot) => {
                    bot.directionTimer -= delta;
                    if(bot.directionTimer <= 0) {
                        // Calculate next route heading
                        bot.directionTimer = 1 + Math.random() * 2;
                        bot.moveVector.set((Math.random() - 0.5), 0, (Math.random() - 0.5)).normalize();
                    }

                    // Move Bot mesh & point forward
                    bot.mesh.position.addScaledVector(bot.moveVector, bot.speed * delta);
                    
                    // Simple boundary collision bounds locking
                    bot.mesh.position.x = Math.max(-38, Math.min(38, bot.mesh.position.x));
                    bot.mesh.position.z = Math.max(-38, Math.min(38, bot.mesh.position.z));
                    
                    if (bot.moveVector.lengthSq() > 0) {
                        const targetAngle = Math.atan2(bot.moveVector.x, bot.moveVector.z);
                        bot.mesh.rotation.y = targetAngle;
                    }

                    // Tactical AI Engagement Combat Core Layer
                    const distanceToPlayer = bot.mesh.position.distanceTo(camera.position);
                    if (distanceToPlayer < 18) {
                        // Look at player while engaging close range
                        bot.mesh.lookAt(camera.position.x, bot.mesh.position.y, camera.position.z);
                        
                        // Tactical Burst Fire parameters processing rate
                        if (now - bot.lastShotTime > 1200) { 
                            bot.lastShotTime = now;
                            // Check basic line of sight chance tracking hit calculation
                            if(Math.random() > 0.4) { 
                                damagePlayer(10);
                            }
                        }
                    }

                    // 4. Transform Global Coordinates Space to Local Overlay Projectors (Screen Display Elements)
                    const tempV = new THREE.Vector3();
                    bot.mesh.getWorldPosition(tempV);
                    tempV.y += 2.0; // Float text labels above heads safely

                    // Screen coordinate transformation tracking matrix projection
                    tempV.project(camera);

                    // Check boundaries relative to camera lens frustum visibility window
                    if(tempV.z <= 1 && Math.abs(tempV.x) < 1 && Math.abs(tempV.y) < 1) {
                        const x = (tempV.x *  .5 + .5) * window.innerWidth;
                        const y = (tempV.y * -.5 + .5) * window.innerHeight;
                        bot.domElement.style.left = `${x}px`;
                        bot.domElement.style.top = `${y}px`;
                        bot.domElement.style.display = 'block';
                    } else {
                        bot.domElement.style.display = 'none';
                    }
                });
            }

            renderer.render(scene, camera);
        }

        // Initialize execution on content render cycles complete
        init();
        animate();
    </script>
</body>
</html>
