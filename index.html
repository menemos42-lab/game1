<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Tactical FPS - Mobile Edition</title>
    <!-- Include Three.js via CDN for 3D Graphics -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            touch-action: none; /* Prevents mobile double-tap zooming */
            background-color: #0a0f18;
        }

        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Heads Up Display (HUD) */
        #hud {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            z-index: 5;
        }

        .hud-panel {
            background: rgba(0, 0, 0, 0.75);
            padding: 10px 15px;
            border-radius: 6px;
            border: 2px solid #00ffcc;
            color: #fff;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
        }

        .health-container {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .bar-bg {
            width: 120px;
            height: 10px;
            background: #441111;
            border-radius: 2px;
            overflow: hidden;
        }

        #playerHealthBar {
            width: 100%;
            height: 100%;
            background: #ff3333;
        }

        /* Crosshair */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 5;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: #00ffcc;
        }
        #crosshair::before { top: 4px; left: -8px; width: 26px; height: 2px; }
        #crosshair::after { top: -8px; left: 4px; width: 2px; height: 26px; }

        /* Mobile Controls Overlay Zones */
        #touchZones {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 3;
            pointer-events: auto;
        }

        /* Virtual Joystick UI Visual */
        #joystickContainer {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 100px;
            height: 100px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(0, 255, 204, 0.4);
            border-radius: 50%;
            display: none; /* Dynamic visibility */
            transform: translate(-50%, -50%);
        }
        #joystickKnob {
            position: absolute;
            top: 30px;
            left: 30px;
            width: 40px;
            height: 40px;
            background: #00ffcc;
            border-radius: 50%;
            box-shadow: 0 0 10px #00ffcc;
        }

        /* Mobile Action Buttons (Right Side) */
        .action-btn {
            position: absolute;
            background: rgba(0, 255, 204, 0.2);
            border: 2px solid #00ffcc;
            color: #00ffcc;
            font-weight: bold;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 6;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
        }
        .action-btn:active {
            background: #00ffcc;
            color: #050b10;
        }
        #fireBtn {
            bottom: 40px;
            right: 40px;
            width: 80px;
            height: 80px;
            font-size: 18px;
        }
        #reloadBtn {
            bottom: 140px;
            right: 50px;
            width: 55px;
            height: 55px;
            font-size: 12px;
        }

        /* Menu Overlay Screens */
        #menuOverlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 15, 20, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 10;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .btn {
            background: #00ffcc;
            color: #050b10;
            border: none;
            padding: 12px 35px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 15px;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
        }

        /* World Floating Healthbars for Bots */
        .bot-health-label {
            position: absolute;
            color: #ff3333;
            font-weight: bold;
            background: rgba(0,0,0,0.85);
            padding: 1px 4px;
            border-radius: 3px;
            font-size: 11px;
            pointer-events: none;
            transform: translate(-50%, -100%);
            border: 1px solid #ff3333;
            display: none;
            z-index: 4;
        }
    </style>
</head>
<body>

    <div id="menuOverlay">
        <h1 style="font-size: 32px; color: #00ffcc; margin-bottom: 5px; letter-spacing: 1px;">MOBILE BOT ARENA</h1>
        <p style="color: #aaa; font-size: 14px; margin: 5px 0 15px 0; max-width: 300px;">Left Thumb: Move around<br>Right Thumb: Aim camera<br>Tap UI buttons to fire/reload</p>
        <button class="btn" id="deployBtn">DEPLOY TO ARENA</button>
    </div>

    <div id="crosshair"></div>

    <div id="hud">
        <div class="hud-panel health-container">
            <div>OPERATOR HP</div>
            <div class="bar-bg"><div id="playerHealthBar"></div></div>
        </div>
        <div class="hud-panel" id="ammoDisplay">
            MAG: 30 / 30
        </div>
    </div>

    <!-- Interactive Mobile Interface Buttons -->
    <div id="fireBtn" class="action-btn">FIRE</div>
    <div id="reloadBtn" class="action-btn">RELOAD</div>

    <!-- Interactive Touch Joystick Layout Element -->
    <div id="touchZones"></div>
    <div id="joystickContainer">
        <div id="joystickKnob"></div>
    </div>

    <!-- Container for dynamic bot health overlays -->
    <div id="botUIContainer"></div>

    <canvas id="gameCanvas"></canvas>

    <script>
        // --- Core Setup Variables ---
        let scene, camera, renderer;
        let clock = new THREE.Clock();
        
        // Player State Variables
        let player = {
            health: 100,
            maxHealth: 100,
            ammo: 30,
            maxAmmo: 30,
            isReloading: false,
            speed: 10,
            position: new THREE.Vector3(0, 1.6, 20)
        };

        // Pitch and Yaw Look Adjusters
        let pitch = 0, yaw = 0;

        // Visual Rig Meshes
        let gunMesh;
        let isShootingAnim = false, shootAnimTimer = 0;

        // AI Bots Config
        let bots = [];
        const botCount = 4;

        // Mobile Touch Processing States Tracker 
        let joystickTouchId = null;
        let lookTouchId = null;
        let joystickCenter = new THREE.Vector2();
        let joystickMove = new THREE.Vector2();
        let lastLookPos = new THREE.Vector2();

        function init() {
            // 1. Scene setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0f18);
            scene.fog = new THREE.FogExp2(0x0a0f18, 0.025);

            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.copy(player.position);

            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gameCanvas'), antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Dynamic capping for smooth phone rendering

            // 2. Lighting Rig
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0x00ffcc, 0.9);
            dirLight.position.set(15, 35, 15);
            scene.add(dirLight);

            // 3. Populate Map Objects
            createArena();

            // 4. Setup First Person View Weapon
            createGun();

            // 5. Build Bots
            spawnBots();

            // 6. Connect Interface Multi-Touch Listeners Setup
            setupTouchControls();
            
            window.addEventListener('resize', onWindowResize);

            // Menu overlay toggle logic button hook
            document.getElementById('deployBtn').addEventListener('click', function() {
                document.getElementById('menuOverlay').style.display = 'none';
            });
        }

        // --- Arena Design Infrastructure ---
        function createArena() {
            const floorGeo = new THREE.PlaneGeometry(80, 80);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x111622, roughness: 0.8 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            const grid = new THREE.GridHelper(80, 30, 0x00ffcc, 0x1b2436);
            grid.position.y = 0.01;
            scene.add(grid);

            // Cover Structures Setup block array loop
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x1b2436, roughness: 0.5 });
            const structures = [
                { w: 25, h: 5, d: 3, x: 0, z: -8 },
                { w: 4, h: 6, d: 4, x: -15, z: 12 },
                { w: 4, h: 6, d: 4, x: 15, z: 12 },
            ];

            structures.forEach(b => {
                const geo = new THREE.BoxGeometry(b.w, b.h, b.d);
                const mesh = new THREE.Mesh(geo, wallMat);
                mesh.position.set(b.x, b.h / 2, b.z);
                scene.add(mesh);
            });
        }

        // --- Weapon Layout Configuration ---
        function createGun() {
            gunMesh = new THREE.Group();

            const bodyGeo = new THREE.BoxGeometry(0.05, 0.06, 0.3);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.6 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            gunMesh.add(body);

            const barrelGeo = new THREE.CylinderGeometry(0.015, 0.015, 0.2);
            barrelGeo.rotateX(Math.PI / 2);
            const barrel = new THREE.Mesh(barrelGeo, bodyMat);
            barrel.position.set(0, 0.01, -0.2);
            gunMesh.add(barrel);

            scene.add(gunMesh);
        }

        // --- Spawn Bots System loop ---
        function spawnBots() {
            const container = document.getElementById('botUIContainer');
            
            for(let i=0; i < botCount; i++) {
                const botGroup = new THREE.Group();
                
                const bodyGeo = new THREE.CylinderGeometry(0.4, 0.4, 1.8, 8);
                const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff3333 });
                const body = new THREE.Mesh(bodyGeo, bodyMat);
                body.position.y = 0.9;
                botGroup.add(body);

                const visorGeo = new THREE.BoxGeometry(0.5, 0.15, 0.2);
                const visorMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
                const visor = new THREE.Mesh(visorGeo, visorMat);
                visor.position.set(0, 1.5, -0.35);
                botGroup.add(visor);

                botGroup.position.set((Math.random() - 0.5) * 45, 0, (Math.random() - 0.5) * 40 - 10);
                scene.add(botGroup);

                const label = document.createElement('div');
                label.className = 'bot-health-label';
                label.id = `bot-label-${i}`;
                label.innerText = 'BOT HP: 100';
                container.appendChild(label);

                bots.push({
                    mesh: botGroup,
                    health: 100,
                    domElement: label,
                    speed: 3 + Math.random() * 2,
                    directionTimer: 0,
                    moveVector: new THREE.Vector3(),
                    lastShotTime: 0
                });
            }
        }

        // --- Touch Engine Integration Controls Map Handler ---
        function setupTouchControls() {
            const touchZones = document.getElementById('touchZones');
            const joyContainer = document.getElementById('joystickContainer');
            const joyKnob = document.getElementById('joystickKnob');

            touchZones.addEventListener('touchstart', function(e) {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    
                    // Left half screening window assigns to Joystick Movement engine
                    if (touch.clientX < window.innerWidth / 2 && joystickTouchId === null) {
                        joystickTouchId = touch.identifier;
                        joystickCenter.set(touch.clientX, touch.clientY);
                        
                        joyContainer.style.display = 'block';
                        joyContainer.style.left = `${touch.clientX}px`;
                        joyContainer.style.top = `${touch.clientY}px`;
                        joyKnob.style.transform = `translate(0px, 0px)`;
                    } 
                    // Right half window mapping assigns to Looking camera manipulation controls
                    else if (touch.clientX >= window.innerWidth / 2 && lookTouchId === null) {
                        lookTouchId = touch.identifier;
                        lastLookPos.set(touch.clientX, touch.clientY);
                    }
                }
            }, {passive: true});

            touchZones.addEventListener('touchmove', function(e) {
                for (let i = 0; i < e.touches.length; i++) {
                    const touch = e.touches[i];

                    if (touch.identifier === joystickTouchId) {
                        let distX = touch.clientX - joystickCenter.x;
                        let distY = touch.clientY - joystickCenter.y;
                        const maxDist = 40; // Joystick outer constraints bounds clamping metric

                        const angle = Math.atan2(distY, distX);
                        const distance = Math.min(maxDist, Math.hypot(distX, distY));

                        const knobX = Math.cos(angle) * distance;
                        const knobY = Math.sin(angle) * distance;
                        joyKnob.style.transform = `translate(${knobX}px, ${knobY}px)`;

                        // Pass normalized parameters back up tracking registers
                        joystickMove.set(knobX / maxDist, knobY / maxDist);
                    } 
                    else if (touch.identifier === lookTouchId) {
                        const deltaX = touch.clientX - lastLookPos.x;
                        const deltaY = touch.clientY - lastLookPos.y;

                        yaw -= deltaX * 0.005;  // Touch look rotation speed parameter scales
                        pitch -= deltaY * 0.005;
                        pitch = Math.max(-Math.PI / 2.3, Math.min(Math.PI / 2.3, pitch));

                        camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
                        lastLookPos.set(touch.clientX, touch.clientY);
                    }
                }
            }, {passive: true});

            const endTouchHandler = function(e) {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    if (touch.identifier === joystickTouchId) {
                        joystickTouchId = null;
                        joystickMove.set(0, 0);
                        joyContainer.style.display = 'none';
                    } else if (touch.identifier === lookTouchId) {
                        lookTouchId = null;
                    }
                }
            };

            touchZones.addEventListener('touchend', endTouchHandler);
            touchZones.addEventListener('touchcancel', endTouchHandler);

            // Assign Fire Button events
            document.getElementById('fireBtn').addEventListener('touchstart', function(e) {
                e.preventDefault();
                fireWeapon();
            });

            // Assign Reload button events
            document.getElementById('reloadBtn').addEventListener('touchstart', function(e) {
                e.preventDefault();
                reloadWeapon();
            });
        }

        // --- Combat Engine Rules Execution ---
        function fireWeapon() {
            if (player.isReloading || document.getElementById('menuOverlay').style.display !== 'none') return;

            if (player.ammo > 0) {
                player.ammo--;
                updateHUD();
                
                isShootingAnim = true;
                shootAnimTimer = 0;

                // Send Raycast forward out from eye lens coordinates
                const raycaster = new THREE.Raycaster();
                raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
                
                const targets = bots.map(b => b.mesh.children[0]);
                const intersects = raycaster.intersectObjects(targets);

                if (intersects.length > 0) {
                    const hitObj = intersects[0].object;
                    const idx = bots.findIndex(b => b.mesh.children[0] === hitObj);
                    if (idx !== -1) {
                        damageBot(idx, 25);
                    }
                }
            } else {
                reloadWeapon();
            }
        }

        function reloadWeapon() {
            if (player.isReloading || player.ammo === player.maxAmmo) return;
            player.isReloading = true;
            document.getElementById('ammoDisplay').innerText = "RELOADING...";
            
            setTimeout(() => {
                player.ammo = player.maxAmmo;
                player.isReloading = false;
                updateHUD();
            }, 1400);
        }

        function damageBot(idx, amount) {
            const bot = bots[idx];
            bot.health -= amount;
            if (bot.health <= 0) {
                bot.mesh.position.set((Math.random() - 0.5) * 45, 0, (Math.random() - 0.5) * 40 - 10);
                bot.health = 100;
            }
            bot.domElement.innerText = `BOT HP: ${bot.health}`;
        }

        function damagePlayer(amount) {
            player.health -= amount;
            if (player.health <= 0) {
                player.health = 100;
                camera.position.set(0, 1.6, 20);
                yaw = 0; pitch = 0;
                camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
                document.getElementById('menuOverlay').style.display = 'flex';
            }
            updateHUD();
        }

        function updateHUD() {
            document.getElementById('playerHealthBar').style.width = `${player.health}%`;
            document.getElementById('ammoDisplay').innerText = `MAG: ${player.ammo} / ${player.maxAmmo}`;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- Dynamic Render Processing Frame Cycles ---
        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1); // Cap cycles step delta safely 

            const isPlaying = document.getElementById('menuOverlay').style.display === 'none';

            if (isPlaying) {
                // 1. Core joystick conversion matrix vector tracking updates
                if (joystickMove.lengthSq() > 0) {
                    const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                    const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
                    forward.y = 0; right.y = 0;
                    forward.normalize(); right.normalize();

                    // Apply layout displacement changes along axis
                    camera.position.addScaledVector(forward, -joystickMove.y * player.speed * delta);
                    camera.position.addScaledVector(right, joystickMove.x * player.speed * delta);
                }

                // Map border fencing wall clamping limits loops
                camera.position.x = Math.max(-38, Math.min(38, camera.position.x));
                camera.position.z = Math.max(-38, Math.min(38, camera.position.z));

                // 2. Align Weapon Models to Viewport Layout Matrix
                gunMesh.position.copy(camera.position);
                gunMesh.quaternion.copy(camera.quaternion);
                gunMesh.translateZ(-0.3);
                gunMesh.translateX(0.09);
                gunMesh.translateY(-0.12);

                if (isShootingAnim) {
                    shootAnimTimer += delta * 45;
                    if (shootAnimTimer < Math.PI) {
                        gunMesh.translateZ(Math.sin(shootAnimTimer) * 0.03);
                        gunMesh.rotateX(Math.sin(shootAnimTimer) * 0.06);
                    } else {
                        isShootingAnim = false;
                    }
                }

                // 3. AI Bot Behavior and Tracking Updates Loop
                const timeNow = performance.now();
                bots.forEach((bot, index) => {
                    bot.directionTimer -= delta;
                    if (bot.directionTimer <= 0) {
                        bot.directionTimer = 1 + Math.random() * 2;
                        bot.moveVector.set((Math.random() - 0.5), 0, (Math.random() - 0.5)).normalize();
                    }

                    bot.mesh.position.addScaledVector(bot.moveVector, bot.speed * delta);
                    
                    const dist = bot.mesh.position.distanceTo(camera.position);
                    if (dist < 18) {
                        bot.mesh.lookAt(camera.position.x, bot.mesh.position.y, camera.position.z);
                        
                        if (timeNow - bot.lastShotTime > 1500) {
                            bot.lastShotTime = timeNow;
                            if (Math.random() > 0.55) {
                                damagePlayer(10);
                            }
                        }
                    } else if (bot.moveVector.lengthSq() > 0) {
                        bot.mesh.rotation.y = Math.atan2(bot.moveVector.x, bot.moveVector.z);
                    }

                    // 4. Project World Space Labels to Screen HTML Elements Coordinates
                    const pos = new THREE.Vector3();
                    bot.mesh.getWorldPosition(pos);
                    pos.y += 2.0;
                    pos.project(camera);

                    if (pos.z <= 1 && Math.abs(pos.x) < 1 && Math.abs(pos.y) < 1) {
                        const x = (pos.x * .5 + .5) * window.innerWidth;
                        const y = (pos.y * -.5 + .5) * window.innerHeight;
                        bot.domElement.style.left = `${x}px`;
                        bot.domElement.style.top = `${y}px`;
                        bot.domElement.style.display = 'block';
                    } else {
                        bot.domElement.style.display = 'none';
                    }
                });
            } else {
                // Ensure text flags clean out if menu pops open
                bots.forEach(b => b.domElement.style.display = 'none');
            }

            renderer.render(scene, camera);
        }

        // Kickoff setup engines
        init();
        animate();
    </script>
</body>
</html>
